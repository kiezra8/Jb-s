        // Auth Functions
        async function login(email, password) {
            try {
                await firebase.auth().signInWithEmailAndPassword(email, password);
                state.showAuthModal = false;
                showToast('Welcome back!');
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        }

        async function signup(email, password, name) {
            try {
                const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                await userCredential.user.updateProfile({ displayName: name });

                // Create user document
                const db = firebase.firestore();
                await db.collection('users').doc(userCredential.user.uid).set({
                    email,
                    name,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                state.showAuthModal = false;
                showToast('Account created successfully!');
            } catch (error) {
                alert('Signup failed: ' + error.message);
            }
        }

        async function logout() {
            try {
                await firebase.auth().signOut();
                state.cart = [];
                state.orders = [];
                state.messages = [];
                showToast('Logged out successfully');
            } catch (error) {
                alert('Logout failed: ' + error.message);
            }
        }

        async function loadUserData() {
            if (!state.currentUser) return;

            const db = firebase.firestore();

            // Load user's orders
            if (state.isAdmin) {
                // Admin sees all orders
                const ordersSnapshot = await db.collection('orders').orderBy('createdAt', 'desc').get();
                state.orders = ordersSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } else {
                // Customer sees only their orders
                const ordersSnapshot = await db.collection('orders')
                    .where('userId', '==', state.currentUser.uid)
                    .get();
                // Sort client-side to avoid Firebase Index error
                state.orders = ordersSnapshot.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            }

            // Count unread messages
            state.unreadCount = state.orders.filter(o => o.unreadByCustomer && !state.isAdmin).length;
        }

            render();

            // Sync with Firebase in background
            if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                try {
                    const db = firebase.firestore();
                    const snapshot = await db.collection('products').get();

                    if (!snapshot.empty) {

                        render();

                        await seedDatabase(db);

        async function seedDatabase(db) {
            const batch = db.batch();
            products.forEach(product => {
                const ref = db.collection('products').doc(product.id.toString());
                batch.set(ref, product);
            });
            try {
                await batch.commit();
                showToast('Database Seeded Successfully!');
            } catch (err) {
                console.error('Error seeding:', err);
                showToast('Error seeding database');
            }

                batch.set(ref, product);
            });
            try {
                await batch.commit();
                showToast('Database Seeded Successfully!');
            } catch (err) {
                console.error('Error seeding:', err);
                showToast('Error seeding database');
            }
        }

        function formatMoney(amount) {
            return 'UGX ' + amount.toLocaleString('en-UG');
        }

        function saveState() {
            localStorage.setItem('jbs_cart', JSON.stringify(state.cart));
        }

        function getFilteredProducts() {
            // If searching, search EVERYTHING (ignore current category filter)
            if (state.searchQuery) {
                return products.filter(p => p.name && p.name.toLowerCase().includes(state.searchQuery.toLowerCase()));
            }
            // Otherwise, filter by category
            return state.selectedCategory === 'all' ? products : products.filter(p => p.category === state.selectedCategory);

        async function placeOrderViaWhatsApp() {
            if (!state.currentUser) {
                state.showAuthModal = true;
                state.showOrderOptions = false;
                showToast('Please login to place an order');
                return;
            }

            const product = state.orderProduct;

            // Prepare WhatsApp message
            let message = '';
            if (product.context === 'order') {
                // Cart order
                message = `Hello! I would like to place an order:\n\n`;
                state.cart.forEach((item, index) => {
                    message += `${index + 1}. ${item.name}\n   Size: ${item.selectedSize}\n   Quantity: ${item.quantity}\n   Price: ${formatMoney(item.price * item.quantity)}\n\n`;
                });
                message += `Total: ${formatMoney(getTotalPrice())}\n\n`;
                message += `Customer: ${state.currentUser.displayName || state.currentUser.email}`;
            } else if (product.context === 'support') {
                // Support chat
                message = `Hello! I need support.\n\nCustomer: ${state.currentUser.displayName || state.currentUser.email}`;
            } else {
                // Single product order
                message = `Hello! I would like to order:\n\n${product.name}\n\nCustomer: ${state.currentUser.displayName || state.currentUser.email}`;
            }

            // Open WhatsApp
            const phoneNumber = '256700742469';
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');

            // Clear cart if this was a cart order
            if (product.context === 'order') {
                state.cart = [];
                saveState();
            }

            state.showOrderOptions = false;
            showToast('Opening WhatsApp...');
            render();
        }

        function addToCart(product, size) {
            if (!size) {
                alert('Please select a size');
                return;
            }
            const existing = state.cart.find(item => item.id === product.id && item.selectedSize === size);
            if (existing) {
                existing.quantity += 1;
            } else {
                state.cart.push({ ...product, selectedSize: size, quantity: 1 });
            }
            state.selectedProduct = null;
            state.selectedSize = '';
            saveState();
            render();
            showToast('Added to cart!');
        }

        function removeFromCart(productId, size) {
            state.cart = state.cart.filter(item => !(item.id === productId && item.selectedSize === size));
            saveState();
            render();
        }

        function updateQuantity(productId, size, delta) {
            const item = state.cart.find(item => item.id === productId && item.selectedSize === size);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    removeFromCart(productId, size);
                } else {
                    saveState();
                    render();
                }
            }
        }

        function getTotalPrice() {
            return state.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

                    ` : ''
                    }

                    <!--Chat Modal-->
                ${state.selectedOrder ? (() => {
                        const order = state.orders.find(o => o.id === state.selectedOrder);
                        if (!order) return '';

                        return `
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[70] flex items-end sm:items-center sm:justify-center p-0 sm:p-4 animate-fade-in" onclick="closeChat(event)">
                            <div class="bg-white rounded-t-3xl sm:rounded-3xl w-full sm:max-w-lg h-[90vh] flex flex-col animate-slide-in-up" onclick="event.stopPropagation()">
                                <!-- Header -->
                                <div class="bg-gray-900 text-white p-4 rounded-t-3xl sm:rounded-t-3xl flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <img src="${order.product?.image || order.items?.[0]?.image}" class="w-12 h-12 rounded-lg object-cover">
                                        <div>
                                            <h3 class="font-bold">${order.product?.name || 'Order Chat'}</h3>
                                            <p class="text-xs opacity-90">Status: ${order.status}</p>
                                        </div>
                                    </div>
                                    <button onclick="closeChat()" class="p-2 hover:bg-white/20 rounded-full transition-colors">
                                        <i data-lucide="x" class="w-6 h-6"></i>
                                    </button>
                                </div>

                                <!-- Messages -->
                                <div class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50" id="chatMessages">
                                    ${!order.messages || order.messages.length === 0 ? `
                                        <div class="text-center py-8 text-gray-500">
                                            <i data-lucide="message-circle" class="w-12 h-12 mx-auto mb-2 text-gray-300"></i>
                                            <p>No messages yet. Start the conversation!</p>
                                        </div>
                                    ` : order.messages.map((msg, i) => {
                            const isMe = (state.isAdmin && msg.isAdmin) || (!state.isAdmin && !msg.isAdmin && !msg.isSystem);
                            return `
                                        <div class="flex ${msg.isSystem ? 'justify-center' : (isMe ? 'justify-end' : 'justify-start')} animate-fade-in-up" style="animation-delay: ${i * 50}ms">
                                            <div class="max-w-[75%] ${msg.isSystem ? 'bg-gray-700 text-gray-300 text-center text-xs py-2' : (isMe ? 'bg-amber-500 text-gray-900' : 'bg-gray-700 text-white')} rounded-2xl p-3 shadow-sm">
                                                ${!msg.isSystem ? `<p class="text-sm font-medium mb-1 ${isMe ? 'text-gray-900' : 'text-amber-500'}"> ${msg.senderName}</p>` : ''}
                                                <p class="text-sm">${msg.text}</p>
                                                <p class="text-xs mt-1 ${isMe ? 'text-gray-800' : 'text-gray-400'}">${msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toLocaleTimeString() : 'Just now'}</p>
                                            </div>
                                        </div>
                                        `;
                        }).join('')}
                                </div>

                                <!-- Admin Controls -->
                                ${state.isAdmin ? `
                                    <div class="border-t p-3 bg-gray-50">
                                        <div class="flex gap-2">
                                            <button onclick="updateOrderStatus('${order.id}', 'confirmed')" class="flex-1 bg-purple-600 text-white py-2 px-3 rounded-lg text-sm font-bold hover:bg-purple-700 active:scale-95 transition-all">
                                                ✓ Confirm
                                            </button>
                                            <button onclick="updateOrderStatus('${order.id}', 'cancelled')" class="flex-1 bg-red-500 text-white py-2 px-3 rounded-lg text-sm font-bold hover:bg-red-600 active:scale-95 transition-all">
                                                ✗ Cancel
                                            </button>
                                            <button onclick="updateOrderStatus('${order.id}', 'completed')" class="flex-1 bg-blue-500 text-white py-2 px-3 rounded-lg text-sm font-bold hover:bg-blue-600 active:scale-95 transition-all">
                                                ✓ Complete
                                            </button>
                                        </div>
                                    </div>
                                ` : ''}

                                <!-- Message Input -->
                                <div class="border-t p-4 bg-white rounded-b-3xl sm:rounded-b-3xl">
                                    <form onsubmit="event.preventDefault(); sendMessage('${order.id}', event);" class="flex gap-2">
                                        <input type="text" name="message" required placeholder="Type a message..." class="flex-1 px-4 py-3 border border-gray-300 rounded-full focus:ring-2 focus:ring-pink-500 focus:border-transparent">
                                        <button type="submit" class="bg-gray-900 text-white p-3 rounded-full hover:bg-gray-800 active:scale-95 transition-all">
                                            <i data-lucide="send" class="w-5 h-5"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    `;
                    })() : ''}
                </div>
            `;
                if (window.lucide) lucide.createIcons();

                // Scroll chat to bottom
                setTimeout(() => {
                    const chatEl = document.getElementById('chatMessages');
                    if (chatEl) chatEl.scrollTop = chatEl.scrollHeight;
                }, 100);
            } catch (error) {
                console.error('❌ Render error:', error);
                alert('Render error: ' + error.message);
                document.getElementById('app').innerHTML = `<div style="padding: 20px; color: red;">Error: ${error.message}</div>`;
            }
        }

        // Auth Form Handlers
        function handleLogin(event) {
            const form = event.target;
            const email = form.email.value;
            const password = form.password.value;
            login(email, password);
        }

        function handleSignup(event) {
            const form = event.target;
            const name = form.name.value;
            const email = form.email.value;
            const password = form.password.value;
            signup(email, password, name);
        }

        // Helper Functions
        function showOrderOptions(product, context = 'buy') {
            state.orderProduct = { ...product, context };
            state.showOrderOptions = true;
            render();
        }

        function selectOrder(orderId) {
            state.selectedOrder = orderId;

            // Mark messages as read
            if (state.currentUser) {
                const db = firebase.firestore();
                const updateField = state.isAdmin ? 'unreadByAdmin' : 'unreadByCustomer';
                db.collection('orders').doc(orderId).update({
                    [updateField]: false
                }).then(() => loadUserData());
            }

            render();
        }

        function closeChat(event) {
            if (event) event.stopPropagation();
            state.selectedOrder = null;
            render();
        }

        async function sendMessage(orderId, event) {
            const form = event.target;
            const messageText = form.message.value.trim();

            if (!messageText || !state.currentUser) return;

            // Open WhatsApp with the message
            const phoneNumber = '256700742469';
            const message = `${messageText}\n\nFrom: ${state.currentUser.displayName || state.currentUser.email}`;
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');

            form.reset();
            showToast('Opening WhatsApp...');
        }

        async function updateOrderStatus(orderId, newStatus) {
            if (!state.isAdmin) return;

            const db = firebase.firestore();

            try {
                await db.collection('orders').doc(orderId).update({
                    status: newStatus
                });

                showToast(`Order ${newStatus}!`);
                await loadUserData();
                render();
            } catch (error) {
                alert('Failed to update status: ' + error.message);
            }
        }

        function switchTab(tab) { state.activeTab = tab; state.viewingCategoryPage = false; render(); }
        function selectCategory(categoryId) {
            if (categoryId === 'all') { state.selectedCategory = 'all'; state.viewingCategoryPage = false; }
            else { state.selectedCategory = categoryId; state.activeTab = 'home'; state.viewingCategoryPage = true; }
            render();
        }
        function backToHome() { state.viewingCategoryPage = false; state.selectedCategory = 'all'; render(); }
        function selectProduct(productId) { state.selectedProduct = productId; state.selectedSize = ''; render(); }
        function closeProductModal(event) { if (event) event.stopPropagation(); state.selectedProduct = null; render(); }
        function selectSize(size) { state.selectedSize = size; render(); }
        function addToCartFromModal() { const p = products.find(p => p.id === state.selectedProduct); if (p) addToCart(p, state.selectedSize); }
        function toggleCart() { state.showCart = !state.showCart; render(); }
        function closeCart(event) { if (event) event.stopPropagation(); state.showCart = false; render(); }
        function toggleMenu() { state.showMenu = !state.showMenu; render(); }
        function handleSearch(event) { state.searchQuery = event.target.value; render(); }

        // --- Real-time Chat & Notifications ---
        let activeChatListener = null;

        function startChatListener(orderId) {
            // Unsubscribe previous listener if exists
            if (activeChatListener) activeChatListener();

            const db = firebase.firestore();
            activeChatListener = db.collection('orders').doc(orderId).onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    const orderIndex = state.orders.findIndex(o => o.id === orderId);

                    // Check for new messages to play sound
                    if (orderIndex !== -1) {
                        const oldMsgs = state.orders[orderIndex].messages || [];
                        const newMsgs = data.messages || [];
                        if (newMsgs.length > oldMsgs.length) {
                            const lastMsg = newMsgs[newMsgs.length - 1];
                            // Play sound if message is NOT from me (incoming)
                            // Helper logic: Admin checks for non-admin msg, User checks for admin msg
                            const isMe = (state.isAdmin && lastMsg.isAdmin) || (!state.isAdmin && !lastMsg.isAdmin);
                            if (!isMe && !lastMsg.isSystem) {
                                playNotificationSound();
                            }
                        }
                    }

                    // Update local state
                    if (orderIndex !== -1) {
                        state.orders[orderIndex] = { id: doc.id, ...data };
                    } else {
                        state.orders.push({ id: doc.id, ...data });
                    }
                    render();
                }
            });
        }

        function playNotificationSound() {
            // Simple beep sound for notifications
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.volume = 0.5;
            audio.play().catch(e => console.log('Audio play prevent by browser', e));
        }

        function selectOrder(orderId) {
            state.selectedOrder = orderId;
            startChatListener(orderId);
            state.viewingCategoryPage = false;
            render();
        }

        function closeChat(event) {
            if (event) event.stopPropagation();
            state.selectedOrder = null;
            // Stop listening when chat closes
            if (activeChatListener) {
                activeChatListener();
                activeChatListener = null;
            }
            // Reload all data to ensure sync
            loadUserData();
            render();
        }
    </script>
</body>

</html>
