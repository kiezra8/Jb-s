    <script>
        // ========================================
        // CLOUDINARY CONFIGURATION
        // ========================================
        // ✅ CONFIGURED with your Cloudinary account: dvfuk2fzp

        const CLOUDINARY_CONFIG = {
            cloudName: 'dvfuk2fzp',
            uploadPreset: 'jbs-tailored-unsigned',
            folder: 'jbs-tailored'
        };

        const CLOUDINARY_WIDGET_CONFIG = {
            cloudName: CLOUDINARY_CONFIG.cloudName,
            uploadPreset: CLOUDINARY_CONFIG.uploadPreset,
            folder: CLOUDINARY_CONFIG.folder,
            sources: ['local', 'camera', 'url'],
            multiple: false,
            maxFileSize: 10000000,
            clientAllowedFormats: ['jpg', 'jpeg', 'png', 'gif', 'webp', 'mp4', 'mov', 'avi'],
            maxImageWidth: 2000,
            maxImageHeight: 2000,
            cropping: true,
            croppingAspectRatio: 1,
            croppingShowDimensions: true,
            showSkipCropButton: true,
            resourceType: 'auto',
            tags: ['jbs-tailored'],
            context: {
                alt: 'Product Image',
                caption: 'JB\'S TAILORED Product'
            }
        };

        // Upload to Cloudinary
        async function uploadToCloudinary(file, options = {}) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_CONFIG.uploadPreset);
            formData.append('folder', options.folder || CLOUDINARY_CONFIG.folder);

            if (options.tags) {
                formData.append('tags', options.tags.join(','));
            }

            if (options.context) {
                formData.append('context', Object.entries(options.context).map(([k, v]) => `${k}=${v}`).join('|'));
            }

            try {
                const response = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/auto/upload`,
                    {
                        method: 'POST',
                        body: formData
                    }
                );

                if (!response.ok) {
                    throw new Error('Upload failed');
                }

                const data = await response.json();
                return {
                    url: data.secure_url,
                    publicId: data.public_id,
                    format: data.format,
                    resourceType: data.resource_type,
                    width: data.width,
                    height: data.height,
                    bytes: data.bytes,
                    createdAt: data.created_at
                };
            } catch (error) {
                console.error('Cloudinary upload error:', error);
                throw error;
            }
        }

        // Get optimized image URL
        function getOptimizedImageUrl(publicId, options = {}) {
            const {
                width = 'auto',
                height = 'auto',
                crop = 'fill',
                quality = 'auto',
                format = 'auto',
                gravity = 'auto'
            } = options;

            return `https://res.cloudinary.com/${CLOUDINARY_CONFIG.cloudName}/image/upload/` +
                `w_${width},h_${height},c_${crop},q_${quality},f_${format},g_${gravity}/` +
                `${publicId}`;
        }

        // Get video URL
        function getVideoUrl(publicId, options = {}) {
            const {
                width = 'auto',
                quality = 'auto',
                format = 'auto'
            } = options;

            return `https://res.cloudinary.com/${CLOUDINARY_CONFIG.cloudName}/video/upload/` +
                `w_${width},q_${quality},f_${format}/` +
                `${publicId}`;
        }

        // Initialize Cloudinary Upload Widget
        function initCloudinaryWidget(callback) {
            if (typeof cloudinary === 'undefined') {
                console.error('Cloudinary script not loaded');
                return null;
            }

            return cloudinary.createUploadWidget(
                CLOUDINARY_WIDGET_CONFIG,
                (error, result) => {
                    if (error) {
                        console.error('Upload widget error:', error);
                        callback(error, null);
                        return;
                    }

                    if (result.event === 'success') {
                        callback(null, {
                            url: result.info.secure_url,
                            publicId: result.info.public_id,
                            format: result.info.format,
                            resourceType: result.info.resource_type,
                            width: result.info.width,
                            height: result.info.height,
                            bytes: result.info.bytes,
                            thumbnail: result.info.thumbnail_url
                        });
                    }
                }
            );
        }

        console.log('✅ Cloudinary configured:', CLOUDINARY_CONFIG.cloudName);
    </script>

        async function loadUserData() {
            if (!state.currentUser) return;

            const db = firebase.firestore();

            // Load user's orders
            if (state.isAdmin) {
                // Admin sees all orders
                const ordersSnapshot = await db.collection('orders').orderBy('createdAt', 'desc').get();
                state.orders = ordersSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } else {
                // Customer sees only their orders
                const ordersSnapshot = await db.collection('orders')
                    .where('userId', '==', state.currentUser.uid)
                    .get();
                // Sort client-side to avoid Firebase Index error
                state.orders = ordersSnapshot.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            }

            // Count unread messages
            state.unreadCount = state.orders.filter(o => o.unreadByCustomer && !state.isAdmin).length;

        function addToCart(product, size) {
            if (!size) {
                alert('Please select a size');
                return;
            }
            const existing = state.cart.find(item => item.id === product.id && item.selectedSize === size);
            if (existing) {
                existing.quantity += 1;
            } else {
                state.cart.push({ ...product, selectedSize: size, quantity: 1 });
            }
            state.selectedProduct = null;
            state.selectedSize = '';
            saveState();
            render();
            showToast('Added to cart!');
        }

        function removeFromCart(productId, size) {
            state.cart = state.cart.filter(item => !(item.id === productId && item.selectedSize === size));
            saveState();
            render();
        }

        function updateQuantity(productId, size, delta) {
            const item = state.cart.find(item => item.id === productId && item.selectedSize === size);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    removeFromCart(productId, size);
                } else {
                    saveState();
                    render();

            }

        async function toggleTrending(productId) {
            if (!state.isAdmin) {

                return;

            const product = products.find(p => p.id === productId);
            if (!product) return;

            // Toggle trending status
            product.trending = !product.trending;

            try {
                // Save to Firebase
                if (db) {
                    const productRef = doc(db, 'products', productId.toString());
                    await updateDoc(productRef, {
                        trending: product.trending
                    });
                    console.log(`✅ Product ${productId} trending status updated to: ${product.trending}`);
                }

                // Save to localStorage as backup
                localStorage.setItem('products', JSON.stringify(products));

                // Show success message
                showToast(product.trending ? '⭐ Added to Trending!' : '✓ Removed from Trending');

                // Re-render
                render();
            } catch (error) {
                console.error('Error updating trending status:', error);
                showToast('Error updating trending status');
                // Revert the change
                product.trending = !product.trending;
            }
        }

        // Handle image upload from phone
        async function handleImageUpload(event, category, key) {
            if (!state.isAdmin) {
                showToast('Admin access required');
                return;
            }

            const file = event.target.files[0];
            if (!file) {
                console.log('❌ No file selected');
                return;
            }

            console.log('📁 File selected:', file.name, 'Size:', file.size, 'Type:', file.type);

            // Validate file type
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                event.target.value = '';
                return;
            }

            // Validate file size (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                alert('Image size must be less than 5MB');
                event.target.value = '';
                return;
            }

            try {
                console.log('🚀 Starting upload for', category, key);
                showToast('Uploading image...');

                // Upload to Firebase Storage
                if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                    const storage = firebase.storage();
                    const storageRef = storage.ref();

                    // Delete old image from Firebase Storage if it exists
                    const oldImageUrl = siteImages[category][key];
                    if (oldImageUrl && oldImageUrl.includes('firebasestorage.googleapis.com')) {
                        try {
                            const oldImageRef = storage.refFromURL(oldImageUrl);
                            await oldImageRef.delete();
                            console.log('🗑️ Old image deleted from Firebase Storage');
                        } catch (error) {
                            console.log('⚠️ Could not delete old image:', error.message);
                        }
                    }

                    // Create unique filename
                    const timestamp = Date.now();
                    const filename = `site-images/${category}/${key}_${timestamp}.${file.name.split('.').pop()}`;
                    const imageRef = storageRef.child(filename);

                    console.log('⏳ Uploading to Firebase Storage...');
                    // Upload file
                    const snapshot = await imageRef.put(file);

                    // Get download URL
                    const downloadURL = await snapshot.ref.getDownloadURL();
                    console.log('✅ Upload successful! URL:', downloadURL);

                    // Update siteImages object (no cache-busting to avoid issues)
                    siteImages[category][key] = downloadURL;

                    // Save to localStorage immediately
                    localStorage.setItem('jbs_site_images', JSON.stringify(siteImages));
                    console.log('💾 Saved to localStorage');

                    // Save to Firestore for persistence
                    try {
                        const db = firebase.firestore();
                        await db.collection('settings').doc('siteImages').set(siteImages, { merge: true });
                        console.log('☁️ Images saved to Firestore');
                    } catch (error) {
                        console.error('❌ Could not save to Firestore:', error);
                    }

                    showToast('✅ Image uploaded successfully!');

                    // Reset file input
                    event.target.value = '';

                    // Force complete re-render with a small delay to ensure state is updated
                    setTimeout(() => {
                        render();
                        // Reinitialize Lucide icons
                        if (typeof lucide !== 'undefined') {
                            lucide.createIcons();
                        }
                    }, 100);

                } else {
                    console.log('⚠️ Firebase not available, using base64 fallback');
                    // Fallback: use base64 for local storage
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const timestamp = Date.now();
                        siteImages[category][key] = e.target.result;

                        // Save to localStorage immediately
                        localStorage.setItem('jbs_site_images', JSON.stringify(siteImages));
                        console.log('💾 Saved base64 to localStorage');

                        showToast('✅ Image loaded successfully!');

                        // Reset file input
                        event.target.value = '';

                        // Force re-render
                        setTimeout(() => {
                            render();
                            if (typeof lucide !== 'undefined') {
                                lucide.createIcons();
                            }
                        }, 100);
                    };
                    reader.onerror = (error) => {
                        console.error('❌ FileReader error:', error);
                        alert('Failed to read image file');
                        event.target.value = '';
                    };
                    reader.readAsDataURL(file);
                }
            } catch (error) {
                console.error('❌ Error uploading image:', error);
                alert('Failed to upload image: ' + error.message);
                event.target.value = '';
            }
        }

                    const db = firebase.firestore();
                    const doc = await db.collection('settings').doc('siteImages').get();
                    if (doc.exists) {

                        Object.assign(siteImages.carousel, data.carousel || {});
                        Object.assign(siteImages.branches, data.branches || {});
                        Object.assign(siteImages.articles, data.articles || {});
                        // Ensure features object exists

                        }
                        // Update localStorage with Firebase data

        // Video Compression Function
        async function compressVideo(file) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                video.preload = 'metadata';
                video.src = URL.createObjectURL(file);

                video.onloadedmetadata = async () => {
                    // Set canvas size (reduce resolution for compression)
                    const maxWidth = 1280;
                    const maxHeight = 720;
                    let width = video.videoWidth;
                    let height = video.videoHeight;

                    if (width > maxWidth) {
                        height = (height * maxWidth) / width;
                        width = maxWidth;
                    }
                    if (height > maxHeight) {
                        width = (width * maxHeight) / height;
                        height = maxHeight;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    // Create MediaRecorder for compression
                    const stream = canvas.captureStream(30); // 30 fps
                    const mediaRecorder = new MediaRecorder(stream, {
                        mimeType: 'video/webm;codecs=vp8',
                        videoBitsPerSecond: 1000000 // 1 Mbps for good quality but smaller size
                    });

                    const chunks = [];
                    mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'video/webm' });
                        URL.revokeObjectURL(video.src);
                        resolve(blob);
                    };

                    mediaRecorder.start();
                    video.play();

                    const drawFrame = () => {
                        if (video.ended || video.paused) {
                            mediaRecorder.stop();
                            return;
                        }
                        ctx.drawImage(video, 0, 0, width, height);
                        requestAnimationFrame(drawFrame);
                    };

                    drawFrame();
                };

                video.onerror = () => {
                    URL.revokeObjectURL(video.src);
                    reject(new Error('Failed to load video'));
                };
            });
        }

        // Video Upload Function
        async function handleVideoUpload(event) {
            if (!state.isAdmin) {
                showToast('Admin access required');
                return;
            }

            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('video/')) {
                alert('Please select a video file');
                event.target.value = '';
                return;
            }

            try {
                console.log('🚀 Processing video...');
                showToast('Compressing video... Please wait.');

                let videoToUpload = file;
                const originalSize = (file.size / (1024 * 1024)).toFixed(2);

                // Compress if larger than 10MB
                if (file.size > 10 * 1024 * 1024) {
                    try {
                        const compressedBlob = await compressVideo(file);
                        const compressedSize = (compressedBlob.size / (1024 * 1024)).toFixed(2);

                        // Create a File object from the blob
                        videoToUpload = new File([compressedBlob], file.name.replace(/\.[^/.]+$/, '.webm'), {
                            type: 'video/webm'
                        });

                        console.log(`✅ Video compressed: ${originalSize}MB → ${compressedSize}MB`);
                        showToast(`Video compressed from ${originalSize}MB to ${compressedSize}MB`);
                    } catch (compressionError) {
                        console.warn('Compression failed, uploading original:', compressionError);
                        showToast('Compression failed, uploading original video...');
                    }
                }

                // Check final size
                if (videoToUpload.size > 100 * 1024 * 1024) {
                    alert('Video is still too large (max 100MB). Please use a shorter video or compress it externally.');
                    event.target.value = '';
                    return;
                }

                console.log('🚀 Uploading video to Cloudinary...');
                showToast('Uploading video... This may take a moment.');

                // Upload to Cloudinary
                const result = await uploadToCloudinary(videoToUpload, {
                    folder: 'jbs-tailored/videos',
                    tags: ['shop-video'],
                    resourceType: 'video'
                });

                console.log('✅ Video uploaded!', result);

                // Update video URL in siteImages or create new property

                    siteImages.video = {};
                }
                siteImages.video.shopVideo = result.secure_url || result.url;

                // Save to localStorage
                localStorage.setItem('jbs_site_images', JSON.stringify(siteImages));

                // Save to Firestore if available

                if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                    try {
                        const db = firebase.firestore();
                        await db.collection('settings').doc('siteImages').set({
                            images: siteImages,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        console.log('☁️ Video saved to Firestore');
                    } catch (firestoreError) {
                        console.warn('⚠️ Firestore save failed (localStorage saved):', firestoreError.message);
                    }
                }

                showToast('✅ Video uploaded successfully! Reloading...');
                event.target.value = '';

                // Force reload to ensure video plays
                setTimeout(() => window.location.reload(), 1500);

            } catch (error) {
                console.error('❌ Error uploading video:', error);
                alert('Failed to upload video: ' + error.message);
                event.target.value = '';
            }
        }

        async function saveProduct(event) {
            if (!state.isAdmin) {
                showToast('Admin access required');
                return;
            }

            try {
                const form = event.target;
                const formData = new FormData(form);

                const sizes = Array.from(form.querySelectorAll('input[name="sizes"]:checked'))
                    .map(cb => cb.value);

                if (sizes.length === 0) {
                    alert('Please select at least one size');
                    return;
                }

                // Use uploaded image if available, otherwise show warning but allow save
                let productImage = state.editingProduct.image;

                if (!productImage || productImage === '' || productImage.includes('loremflickr.com')) {
                    // No image uploaded - show warning but allow save with placeholder
                    console.warn('⚠️ No image uploaded for this product');
                    productImage = `https://via.placeholder.com/800x800/e5e7eb/6b7280?text=${encodeURIComponent(formData.get('name'))}`;
                    showToast('⚠️ Product saved without image. Please upload an image and edit the product.');
                }

                console.log('💾 Saving product with image:', productImage);

                const productData = {
                    id: state.editingProduct.id,
                    name: formData.get('name'),
                    description: formData.get('name'),
                    price: parseInt(formData.get('price')),
                    category: formData.get('category'),
                    image: productImage,
                    sizes: sizes,
                    rating: state.editingProduct.rating || '4.5',
                    reviews: state.editingProduct.reviews || Math.floor(Math.random() * 300) + 20
                };

                console.log('📦 Product data to save:', productData);

                const existingIndex = products.findIndex(p => p.id === productData.id);

                if (existingIndex >= 0) {
                    products[existingIndex] = productData;
                } else {
                    products.push(productData);
                }

                // Save to localStorage first (always works)
                localStorage.setItem('jbs_products', JSON.stringify(products));
                console.log('💾 Saved to localStorage');

                // Save to Firestore
                if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                    try {
                        const db = firebase.firestore();
                        await db.collection('products').doc(String(productData.id)).set(productData);
                        console.log('☁️ Saved to Firestore');
                    } catch (firestoreError) {
                        console.warn('⚠️ Firestore save failed (localStorage saved):', firestoreError.message);
                    }
                }

                showToast(existingIndex >= 0 ? '✅ Product updated!' : '✅ Product added!');
                state.editingProduct = null;
                render();
            } catch (error) {
                console.error('❌ Error saving product:', error);
                alert('Failed to save product: ' + error.message);
            }
        }

        async function clearAllProducts() {
            if (!state.isAdmin) {
                showToast('Admin access required');
                return;
            }

            const confirmMessage = `⚠️ WARNING: This will delete ALL ${products.length} products!\n\nThis action cannot be undone. Are you absolutely sure?`;

            if (!confirm(confirmMessage)) {
                return;
            }

            // Double confirmation for safety
            if (!confirm('Last chance! Delete ALL products?')) {
                return;
            }

            try {
                console.log('🗑️ Clearing all products...');

                // Clear products array
                products = [];

                // Clear localStorage
                localStorage.removeItem('jbs_products');
                console.log('💾 Cleared from localStorage');

                // Try to clear Firestore (optional)
                if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                    try {
                        const db = firebase.firestore();
                        const snapshot = await db.collection('products').get();

                        // Delete in batches
                        const batch = db.batch();
                        snapshot.docs.forEach(doc => {
                            batch.delete(doc.ref);
                        });
                        await batch.commit();

                        console.log('☁️ Cleared from Firestore');
                    } catch (firestoreError) {
                        console.log('⚠️ Firestore clear failed (localStorage cleared):', firestoreError.message);
                    }
                }

                showToast('✅ All products cleared! You can now start fresh.');
                render();
            } catch (error) {
                console.error('❌ Error clearing products:', error);
                alert('Failed to clear products: ' + error.message);
            }
        }

        // --- Real-time Chat & Notifications ---
        let activeChatListener = null;

        function startChatListener(orderId) {
            // Unsubscribe previous listener if exists
            if (activeChatListener) activeChatListener();

            const db = firebase.firestore();
            activeChatListener = db.collection('orders').doc(orderId).onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    const orderIndex = state.orders.findIndex(o => o.id === orderId);

                    // Check for new messages to play sound
                    if (orderIndex !== -1) {
                        const oldMsgs = state.orders[orderIndex].messages || [];
                        const newMsgs = data.messages || [];
                        if (newMsgs.length > oldMsgs.length) {
                            const lastMsg = newMsgs[newMsgs.length - 1];
                            // Play sound if message is NOT from me (incoming)
                            // Helper logic: Admin checks for non-admin msg, User checks for admin msg
                            const isMe = (state.isAdmin && lastMsg.isAdmin) || (!state.isAdmin && !lastMsg.isAdmin);
                            if (!isMe && !lastMsg.isSystem) {
                                playNotificationSound();
                            }
                        }
                    }

                    // Update local state
                    if (orderIndex !== -1) {
                        state.orders[orderIndex] = { id: doc.id, ...data };
                    } else {
                        state.orders.push({ id: doc.id, ...data });
                    }
                    render();
                }
            });
        }

        function playNotificationSound() {
            // Simple beep sound for notifications
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.volume = 0.5;
            audio.play().catch(e => console.log('Audio play prevent by browser', e));
        }

        function selectOrder(orderId) {
            state.selectedOrder = orderId;

            state.viewingCategoryPage = false;
            render();
        }

        function closeChat(event) {
            if (event) event.stopPropagation();
            state.selectedOrder = null;
            // Stop listening when chat closes
            if (activeChatListener) {
                activeChatListener();
                activeChatListener = null;
            }
            // Reload all data to ensure sync
            loadUserData();
            render();
        }
